<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWI Contact-Us</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <!-- CONTACT SECTION -->
<section class="contact-section">

  <!-- LEFT: CONTACT FORM -->
  <div class="contact-form-container">

    <h2>Get in touch with us</h2>

    <p class="contact-description">
      Have a question, need assistance or want to learn more about our
      programmes? Send us a message and our team will get back to you.
    </p>

    <form action="" class="contact-form"  >

      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Miracle Offordile"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="chifurumnanya330@gmail.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="9042122445"
        >
      </div>

      <div class="form-group">
        <label for="message">How may we be of assistance?</label>
        <textarea
          id="message"
          placeholder="Type your message here..."
          required
        ></textarea>
      </div>

      <button type="submit" class="send-btn">Send</button>

    </form>

  </div>


  <!-- RIGHT: CONTACT IMAGE -->
  <div class="contact-image">
    <img src="images/contact-person.png" alt="Customer support representative">
  </div>

</section>


<!-- WHATSAPP BUTTON -->
<a
  href="https://wa.me/234"
  class="whatsapp-btn"
  target="_blank"
  aria-label="Chat with us on WhatsApp"
>
  <img src="images/whatsapp.png" alt="WhatsApp">
</a>


<!-- GOOGLE MAP -->
<section class="contact-map">
  <iframe
    src="https://www.google.com/maps?q=Camden%20Town%2C%20London&output=embed"
    width="100%"
    height="100%"
    style="border:0;"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</section>

</body>
</html>
